<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — LangX Token</title>
    <!--
      Cloudflare Pages treats a site with no top-level 404.html as a single-page
      app and answers every unknown path with the homepage and a 200. For a
      static site that is a soft 404 on every typo — and it made /robots.txt and
      /sitemap.xml return the homepage too. This file is what turns that off.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <meta name="theme-color" content="#130900" />
  </head>

  <body>
    <header id="header">
      <a class="wordmark" href="/">LangX</a>
      <nav class="nav" aria-label="Sections">
        <a href="/#learn-to-earn">Scoring</a>
        <a href="/#using-langx-tokens">Spend</a>
        <a href="/#questions">FAQ</a>
      </nav>
    </header>

    <section id="hero">
      <p class="kicker">404 &middot; Page not found</p>
      <h1>Game<br />over</h1>
      <p class="lede">
        There is nothing at this address. The LangX Token page is one page, in
        eight languages &mdash; start again from the top.
      </p>
      <p class="footnote">
        <a href="/">token.langx.io</a> &middot;
        <a href="https://langx.io">langx.io</a> &middot;
        <a href="https://docs.langx.io/docs/token/token">docs</a>
      </p>
    </section>
  </body>
</html>
